<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Project 900</title>
  <!-- 引入像素風字體 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Press+Start+2P&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- 加入 playsinline -->
<video autoplay muted loop playsinline id="bg-video">
  <source src="assets/bg.mp4" type="video/mp4">
</video>

  <!-- 全域音效 -->
  <audio id="bgm" src="assets/bgm.mp3" loop></audio>

  <!-- 1. 開場選單畫面 (Title Screen) -->
  <div id="title-screen" class="screen active">
    <h1 class="game-title">Project 900</h1>
    <div class="menu-container">
      <button class="pixel-btn" id="start-btn">Start Game</button>
      <button class="pixel-btn" id="settings-btn">Settings</button>
      <button class="pixel-btn" id="quit-btn">Quit Game</button>
    </div>
  </div>

  <!-- 2. 小精靈對話開場畫面 (Prologue Screen) -->
  <div id="prologue-screen" class="screen hidden">
    <div class="dialog-wrapper">
      <img src="assets/fairy.png" alt="小精靈芸芸" class="fairy-sprite">
      <div class="dialog-box">
        <h3 class="dialog-name">小精靈芸芸</h3>
        <p id="dialog-text"></p>
        <button class="pixel-btn next-btn hidden" id="prologue-next-btn">接受委託 ▶</button>
      </div>
    </div>
  </div>

  <!-- 3. 遊戲地圖畫面 (Map Hub Screen) -->
  <div id="map-screen" class="screen hidden">
    <!-- 地圖背景圖可以另外在 CSS 設定，或沿用背景影片 -->
    <div class="map-container">
      
      <!-- 關卡節點 (Level Nodes) -->
      <!-- 預設第一關開放(active)，其餘上鎖(locked) -->
      <button class="level-node active" id="node-1" onclick="startLevel(1)">1</button>
      <button class="level-node locked" id="node-2" onclick="startLevel(2)">2</button>
      <button class="level-node locked" id="node-3" onclick="startLevel(3)">3</button>
      <button class="level-node locked treasure" id="node-treasure" onclick="claimTreasure()">🎁</button>

      <!-- 連接線 (視覺裝飾用) -->
      <svg class="map-lines" width="100%" height="100%">
        <!-- 這裡之後可以畫虛線連接節點 -->
      </svg>
    </div>

    <!-- 地圖專屬：迷你小精靈對話框 -->
    <div class="map-dialog-wrapper">
      <img src="assets/fairy.png" alt="小精靈" class="map-fairy-sprite">
      <div class="map-dialog-box">
        <p id="map-dialog-text">這就是收藏在我們王國的寶藏圖，上方有著可愛老婆留下的線索。<br><br>勇者如果你準備完成，就跟隨地圖完成關卡找出祕寶吧！</p>
      </div>
    </div>
  </div>

  <!-- 4. 第一關：選擇題畫面 (Level 1 Screen) -->
  <div id="level-1-screen" class="screen hidden">
    
    <!-- 新增：關卡前置說明 -->
    <div id="level-1-intro" class="dialog-box intro-box">
      <h3 class="dialog-name">小精靈芸芸</h3>
      <p id="intro-text">準備好了嗎？接下來會有三個小問題，請仔細回想與作答，選出唯一正確的答案！<br><br>全部答對才能解鎖下一關的線索唷！</p>
      <button class="pixel-btn next-btn" id="start-quiz-btn">開始挑戰 ▶</button>
    </div>

    <!-- 原本的選擇題版面 (預設先隱藏，加上 id 以便 JS 控制) -->
    <div id="quiz-content" class="quiz-layout" style="display: none;">
      <!-- 左側：問題圖片 -->
      <div class="quiz-left">
        <img id="question-image" src="" alt="第一關問題">
      </div>
      
      <!-- 右側：選項按鈕區 -->
      <div class="quiz-right" id="options-container">
        <!-- JS 動態生成按鈕 -->
      </div>
    </div>
  </div>

<!-- 5. 第二關：時間線拖曳畫面 (Level 2 Screen) -->
  <div id="level-2-screen" class="screen hidden">
    
    <!-- 關卡前置說明 -->
    <div id="level-2-intro" class="dialog-box intro-box">
      <h3 class="dialog-name">小精靈芸芸</h3>
      <p id="intro-text-2">歡迎來到第二關！這裡散落了一路走來的回憶碎片。<br><br>請按住圖片並拖曳，按照「時間發生的先後順序」，把它們排入時間線中吧！</p>
      <button class="pixel-btn next-btn" id="start-level-2-btn">開始排列 ▶</button>
    </div>

    <!-- 拖曳遊戲版面 -->
    <div id="level-2-content" class="drag-layout" style="display: none;">
      <h2 class="level-title">第二關：時光軌跡</h2>
      
      <!-- 時間線 (放置區 Drop Zones) -->
      <div class="timeline-container">
        <div class="timeline-slot" data-slot="1"></div>
        <div class="timeline-arrow">➔</div>
        <div class="timeline-slot" data-slot="2"></div>
        <div class="timeline-arrow">➔</div>
        <div class="timeline-slot" data-slot="3"></div>
        <div class="timeline-arrow">➔</div>
        <div class="timeline-slot" data-slot="4"></div>
      </div>

      <!-- 碎片池 (可拖曳圖片區) -->
      <!-- 提示：可以把 src 換成你們去東京迪士尼海洋、或是做戒指的去背合照！ -->
      <div class="draggables-pool" id="draggables-pool">
        <!-- 圖片 1：設定 data-id 作為驗證答案的依據 -->
        <div class="draggable-item" draggable="true" data-id="item-hair">
          <img src="assets/hair.png" alt="一起去美髮">
        </div>
        <!-- 圖片 2 -->
        <div class="draggable-item" draggable="true" data-id="item-japan">
          <img src="assets/japan.png" alt="日本旅遊">
        </div>
        <!-- 圖片 3 -->
        <div class="draggable-item" draggable="true" data-id="item-hk">
          <img src="assets/hk.png" alt="第一次一起出國">
        </div>
        <!-- 圖片 4 -->
        <div class="draggable-item" draggable="true" data-id="item-army">
          <img src="assets/army.png" alt="醬醬當兵">
        </div>
      </div>

      <!-- 確認答案按鈕 -->
      <button class="pixel-btn check-btn" id="check-level-2-btn">確認時間線</button>
    </div>
  </div>

  <!-- 6. 第三關：時光保險箱 (Level 3 Screen) -->
  <div id="level-3-screen" class="screen hidden">
    <div class="lock-layout">
      <h2 class="level-title">最終關：時光保險箱</h2>

      <!-- 寶箱與提示區 -->
      <div class="chest-container">
        <!-- 提醒：你的附圖副檔名是 .jpg，請確認你實際放入 assets/ 的檔案名稱 -->
        <img src="assets/box.png" alt="上鎖的寶箱" id="treasure-chest">
        <button class="hint-btn" id="hint-btn">❓ 提示</button>
      </div>

      <!-- 密碼輸入區 (4 個獨立數字框) -->
      <div class="password-container">
        <input type="text" class="pixel-input digit-input" maxlength="1" pattern="\d*">
        <input type="text" class="pixel-input digit-input" maxlength="1" pattern="\d*">
        <input type="text" class="pixel-input digit-input" maxlength="1" pattern="\d*">
        <input type="text" class="pixel-input digit-input" maxlength="1" pattern="\d*">
      </div>

      <button class="pixel-btn check-btn" id="unlock-btn">解鎖寶藏</button>
    </div>
  </div>

  <!-- ========================================= -->
  <!-- 隱藏功能：設定彈窗 (Settings Modal)       -->
  <!-- ========================================= -->
  <div id="settings-modal" class="modal hidden">
    <div class="modal-content">
      <h2 class="level-title" style="font-size: 2rem; margin-bottom: 20px;">Settings</h2>
      
      <div class="volume-control">
        <label for="bgm-volume">BGM 音量：</label>
        <input type="range" id="bgm-volume" min="0" max="1" step="0.1" value="1">
      </div>
      
      <button class="pixel-btn" id="close-settings-btn">確認</button>
    </div>
  </div>

 <!-- ========================================= -->
  <!-- 7. 最終寶藏影片畫面 (Treasure Screen)      -->
  <!-- ========================================= -->
  <div id="treasure-screen" class="screen hidden">
    <div class="video-container">
      <h2 class="level-title" style="font-size: 2rem; margin-bottom: 15px;">900 天祕寶</h2>
      
      <p id="treasure-text" style="font-size: 1.2rem; line-height: 1.8; color: #4a4a4a; margin-bottom: 20px; text-align: center;">
        勇者大人，恭喜你解開了所有謎題！<br>點擊下方按鈕，前往領取專屬於你的驚喜吧！
      </p>

      <!-- 雲端影片連結按鈕 (請將 href 裡面的網址換成你的 Google Drive 或 YouTube 連結) -->
      <a href="https://drive.google.com/file/d/13CfRNXDiJgFN5zlfYXjENGjB3wFwoGOs/view?usp=drive_link" target="_blank" class="pixel-btn" id="cloud-video-btn" style="text-decoration: none; display: inline-block; margin-bottom: 25px;">
        點選前往
      </a>
      
      <button class="pixel-btn" id="back-to-map-btn">返回地圖</button>
    </div>
  </div>
  
  <script src="script.js"></script>
</body>
</html>
